spring.application.name=ecommerce
server.port=9555
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${PASSWORD_DB:mi_password_secreto_local}
spring.datasource.drive-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgresPlusDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaUltraSeguraYMuyLargaParaGarantizarLos256BitsExigidosPorElAlgoritmoDeFirma}
jwt.expiration=${JWT_EXPIRATION:3600000}